<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özel Bir Soru...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Georgia', serif;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        .hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            font-size: 24px;
            animation: float 4s infinite ease-in-out;
        }
        @keyframes float {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.85);
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 2px solid #ffb6c1;
        }

        h1 {
            color: #d63384;
            font-size: 2rem;
            margin-bottom: 30px;
            text-shadow: 1px 1px 2px #fff;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            font-family: inherit;
        }

        #btnEvet {
            background-color: #28a745;
            color: white;
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }

        #btnEvet:hover {
            transform: scale(1.1);
            background-color: #218838;
        }

        #btnHayir {
            background-color: #dc3545;
            color: white;
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #tesekkurEkrani {
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        #tesekkurEkrani h1 {
            color: #28a745;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        #foto {
            width: 300px;
            height: auto;
            border-radius: 15px;
            border: 5px solid white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-top: 20px;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .patlama {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: #ff0000;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: patla 0.5s forwards;
            z-index: 9999;
        }

        @keyframes patla {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 1); opacity: 1; }
            100% { box-shadow: 0 0 50px 100vw rgba(255, 0, 0, 0); opacity: 0; }
        }

        .karartma {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            z-index: 10000;
            display: none;
            color: white;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-family: sans-serif;
        }

    </style>
</head>
<body>

    <div class="hearts" id="heartsContainer"></div>

    <div class="container" id="anaIcerik">
        <h1>Benimle sonsuza dek bacı olur musun? 🌸</h1>
        <div class="buttons">
            <button id="btnEvet">Evet</button>
            <button id="btnHayir">Hayır</button>
        </div>
    </div>

    <div id="tesekkurEkrani">
        <h1>Teşekkürler Hanımefendi! ❤️</h1>
        <p>Bu senin için guzel hanım 😘</p>
        <img id="foto" src="https://i.imgur.com/Zl9lXZI.jpeg" alt="Köpek ve Çiçek">
    </div>

    <div class="karartma" id="karartma">
        BOOM! 💥
    </div>

    <script>
        let acilmaSayisi = localStorage.getItem('acilmaSayisi') || 0;
        
        if (localStorage.getItem('sitePatladi') === 'true' && acilmaSayisi >= 2) {
            document.body.innerHTML = `
                <div style="display:flex; justify-content:center; align-items:center; height:100vh; background:black; color:white; font-family:sans-serif; text-align:center; padding:20px;">
                    <h1>💥 Bu sayfa patladı ve bir daha açılmamak üzere yok oldu! 💥</h1>
                </div>
            `;
        } else {
            const heartsContainer = document.getElementById('heartsContainer');
            for (let i = 0; i < 20; i++) {
                let heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '❤';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = Math.random() * 100 + 'vh';
                heart.style.animationDelay = Math.random() * 4 + 's';
                heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
                heartsContainer.appendChild(heart);
            }

            let hayirTiklamaSayisi = 0;
            const btnEvet = document.getElementById('btnEvet');
            const btnHayir = document.getElementById('btnHayir');
            const anaIcerik = document.getElementById('anaIcerik');
            const tesekkurEkrani = document.getElementById('tesekkurEkrani');
            const karartma = document.getElementById('karartma');

            btnHayir.addEventListener('click', () => {
                hayirTiklamaSayisi++;
                let yeniBoyut = 1 + (hayirTiklamaSayisi * 0.5); 
                btnHayir.style.transform = `scale(${yeniBoyut})`;
                let evetBoyut = 1 - (hayirTiklamaSayisi * 0.1);
                if (evetBoyut < 0.3) evetBoyut = 0.3;
                btnEvet.style.transform = `scale(${evetBoyut})`;

                if (hayirTiklamaSayisi > 3) {
                    btnHayir.style.position = 'absolute';
                    btnHayir.style.zIndex = '100';
                }
                const yazilar = ["Hayır", "Emin misin?", "Gerçekten mi?", "Yapma...", "Bacı olalım işte?", "Hayır diyemezsin ki!", "Büyüyorum!", "Son şansın!"];
                if (hayirTiklamaSayisi < yazilar.length) {
                    btnHayir.innerText = yazilar[hayirTiklamaSayisi];
                } else {
                    btnHayir.innerText = "Artık çok geç!";
                }
            });

            btnEvet.addEventListener('click', () => {
                anaIcerik.style.display = 'none';
                tesekkurEkrani.style.display = 'flex';
                
                setTimeout(() => {
                    patlatVeKapat();
                }, 10000); 
            });

            function patlatVeKapat() {
                let patlamaEfekti = document.createElement('div');
                patlamaEfekti.classList.add('patlama');
                document.body.appendChild(patlamaEfekti);

                setTimeout(() => {
                    karartma.style.display = 'flex';
                    
                    localStorage.setItem('sitePatladi', 'true');
                    
                    acilmaSayisi++;
                    localStorage.setItem('acilmaSayisi', acilmaSayisi);

                    setTimeout(() => {
                        window.close();
                        document.body.innerHTML = '<h1 style="color:white; background:black; height:100vh; display:flex; justify-content:center; align-items:center; margin:0;">Güle güle! 💥</h1>';
                    }, 2000);
                }, 500); 
            }
        }
    </script>
</body>
</html>
